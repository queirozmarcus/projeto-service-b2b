apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "user-service.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "user-service.labels" . | nindent 4 }}
data:
  # Perfil Spring ativo — determina qual application-{profile}.yml carregar
  SPRING_PROFILES_ACTIVE: {{ .Values.config.springProfilesActive | quote }}

  # Porta de escuta do servidor embarcado
  SERVER_PORT: {{ .Values.config.serverPort | quote }}

  # Virtual threads (Project Loom) — Java 21 + Spring Boot 3.2
  # Substitui Tomcat thread pool por virtual threads gerenciadas pela JVM
  SPRING_THREADS_VIRTUAL_ENABLED: {{ .Values.config.springThreadsVirtualEnabled | quote }}

  # Graceful shutdown: cada fase (web) tem este tempo para drenar conexões
  # antes que o container seja encerrado. Deve ser < terminationGracePeriodSeconds.
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: {{ .Values.config.springLifecycleTimeoutPerShutdownPhase | quote }}

  # Actuator: expõe /actuator/health (probes Kubernetes), /actuator/prometheus
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: {{ .Values.config.managementEndpointsWebExposureInclude | quote }}

  # Habilita probes separadas: /actuator/health/liveness e /actuator/health/readiness
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: {{ .Values.config.managementEndpointHealthProbesEnabled | quote }}

  # Detalhes de health: only para usuários autorizados (evita vazamento de info em produção)
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: {{ .Values.config.managementEndpointHealthShowDetails | quote }}

  # Flyway desabilitado: banco compartilhado — monólito gerencia todas as migrations.
  # O user-service NUNCA deve rodar migrations durante o Strangler Fig.
  FLYWAY_ENABLED: {{ .Values.config.flywayEnabled | quote }}
