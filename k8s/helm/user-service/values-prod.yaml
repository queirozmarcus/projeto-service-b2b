# values-prod.yaml — overrides para ambiente de produção
# Aplicar sobre values.yaml:
#   helm upgrade --install user-service ./k8s/helm/user-service \
#     -f k8s/helm/user-service/values-prod.yaml \
#     --set image.tag=$RELEASE_TAG \
#     --namespace production

replicaCount: 3

image:
  repository: scopeflow/user-service
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

hpa:
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

pdb:
  minAvailable: 2

config:
  springProfilesActive: "production"
  flywayEnabled: "false"
