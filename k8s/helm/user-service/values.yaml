# values.yaml — valores padrão (base para todos os ambientes)
# Sobrescrever com values-staging.yaml ou values-prod.yaml no deploy:
#   helm upgrade --install user-service ./k8s/helm/user-service \
#     -f k8s/helm/user-service/values-staging.yaml \
#     --set image.tag=abc1234

# Configuração de réplicas
replicaCount: 2

# Imagem Docker
image:
  repository: scopeflow/user-service
  tag: "latest"
  pullPolicy: IfNotPresent

# Conta de serviço dedicada (principle of least privilege)
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Service Kubernetes
service:
  type: ClusterIP
  port: 8081
  targetPort: 8081
  annotations: {}

# Ingress — user-service tem prioridade sobre o monólito para os paths de auth/users.
# A annotation nginx.ingress.kubernetes.io/server-snippet com return no monólito NÃO é usada aqui:
# a prioridade é garantida pelo campo `priority` na annotation abaixo (quanto maior, maior precedência).
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Timeout alinhado com terminationGracePeriodSeconds do pod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
  hosts:
    - host: api.scopeflow.com
      paths:
        - path: /api/v1/auth
          pathType: Prefix
        - path: /api/v1/users
          pathType: Prefix
  tls:
    - secretName: user-service-tls
      hosts:
        - api.scopeflow.com

# Resources — baseados em profiling do user-service Java 21 com virtual threads:
#   - Serviço especializado (auth/users only): footprint menor que o monólito
#   - Heap: 75% de 512Mi limit = ~384Mi (configurado via MaxRAMPercentage no Dockerfile)
#   - Request de 256Mi garante scheduling em nodes com pressão de memória
resources:
  requests:
    cpu: 125m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Horizontal Pod Autoscaler
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  # CPU 70%: threshold seguro antes de saturar virtual threads
  targetCPUUtilizationPercentage: 70
  # Memória 80%: alerta antecipado — Java tende a crescer gradualmente
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget — garante disponibilidade durante rolling updates e
# operações de manutenção de node (drain). minAvailable=1 garante pelo menos
# uma réplica saudável enquanto outra é encerrada.
pdb:
  enabled: true
  minAvailable: 1

# Probes — alinhadas com os endpoints de health do user-service na porta 8081
probes:
  # Startup probe: dá tempo para a JVM + Spring Boot inicializar
  # 30 tentativas * 10s = 5 minutos máximos de startup
  startup:
    httpGet:
      path: /api/v1/health
      port: 8081
    failureThreshold: 30
    periodSeconds: 10
    initialDelaySeconds: 0

  # Liveness probe: reinicia o container se a app travar (deadlock, OOM recuperável)
  liveness:
    httpGet:
      path: /api/v1/health
      port: 8081
    initialDelaySeconds: 0
    periodSeconds: 15
    failureThreshold: 3
    timeoutSeconds: 5

  # Readiness probe: remove o pod do load balancer se não estiver pronto para receber tráfego
  # /api/v1/health/ready verifica dependências (DB)
  readiness:
    httpGet:
      path: /api/v1/health/ready
      port: 8081
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 3
    timeoutSeconds: 3

# Graceful shutdown
# terminationGracePeriodSeconds: tempo máximo que o kubelet aguarda antes de SIGKILL
# Deve ser maior que o spring.lifecycle.timeout-per-shutdown-phase (20s) + preStop sleep (5s)
terminationGracePeriodSeconds: 30

# Configurações não-sensíveis via ConfigMap
# Sensíveis (DB password, JWT secret) devem ser injetadas via Secret/Sealed Secret
config:
  springProfilesActive: "kubernetes"
  serverPort: "8081"
  # Virtual threads (Project Loom) — Java 21 + Spring Boot 3.2
  # Substitui Tomcat thread pool por virtual threads gerenciadas pela JVM
  springThreadsVirtualEnabled: "true"
  # Graceful shutdown: cada fase tem 20s para completar
  springLifecycleTimeoutPerShutdownPhase: "20s"
  # Actuator: expõe health, info e prometheus para Kubernetes e Prometheus scraping
  managementEndpointsWebExposureInclude: "health,info,prometheus"
  managementEndpointHealthProbesEnabled: "true"
  managementEndpointHealthShowDetails: "when-authorized"
  # Flyway desabilitado: banco compartilhado — monólito gerencia todas as migrations
  flywayEnabled: "false"

# Referências a Secrets externos (criados fora do chart — Sealed Secrets ou External Secrets)
# O Deployment monta esses secrets como env vars
externalSecrets:
  # Mesmo secret do monólito — banco compartilhado durante o Strangler Fig
  databaseSecretName: "scopeflow-db-credentials"
  # Mesmo secret do monólito — JWT deve ser validado com a mesma chave
  jwtSecretName: "scopeflow-jwt-secret"

# Affinity: distribui pods em nodes diferentes para alta disponibilidade
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - user-service
          topologyKey: kubernetes.io/hostname

# Security context — non-root, read-only filesystem, sem escalada de privilégio
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
