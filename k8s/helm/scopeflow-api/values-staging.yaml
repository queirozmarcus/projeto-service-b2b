# values-staging.yaml — overrides para ambiente de staging
# Aplicar sobre values.yaml:
#   helm upgrade --install scopeflow-api ./k8s/helm/scopeflow-api \
#     -f k8s/helm/scopeflow-api/values-staging.yaml \
#     --set image.tag=$CI_COMMIT_SHA \
#     --namespace staging

replicaCount: 1

image:
  repository: scopeflow/scopeflow-api
  pullPolicy: Always

resources:
  requests:
    cpu: 125m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  minReplicas: 1
  maxReplicas: 3

ingress:
  hosts:
    - host: api.staging.scopeflow.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: scopeflow-api-staging-tls
      hosts:
        - api.staging.scopeflow.com

config:
  springProfilesActive: "staging"
  authServiceExtracted: "true"
  authServiceUrl: "http://user-service:8081/api/v1"
