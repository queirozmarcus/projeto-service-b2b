spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scopeflow_users}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # NEVER auto-create schema -- Flyway manages all DDL
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  # Flyway habilitado: user-service gerencia seu próprio schema
  # baseline-on-migrate: true é OBRIGATÓRIO quando o banco já contém dados migrados via pg_dump.
  # baseline-version: 0 garante que V1 seja executado normalmente no banco zerado (novo dev / CI),
  # e marcado como baseline quando o banco já tiver os dados do cut-over.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  # Graceful shutdown (mandatory for Strangler Fig zero-downtime)
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:30s}

  threads:
    virtual:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # RabbitMQ -- disabled for now (user-service does not need messaging yet)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

server:
  port: ${SERVER_PORT:8081}
  shutdown: ${SERVER_SHUTDOWN:graceful}
  # Sem context-path: o controller já inclui /api/v1 no @RequestMapping.
  # O monólito usa context-path=/api/v1 porque seus controllers mapeiam /auth (sem prefixo).
  # Aqui o controller é @RequestMapping("/api/v1/auth") — adicionar context-path criaria double prefix:
  #   request: /api/v1/auth/register → strip context → /auth/register → no match ❌
  # context-path: /api/v1  ← REMOVIDO
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# Management endpoints (Spring Actuator)
# Served on separate management port to avoid context-path interference with healthchecks
management:
  # server:
    # port: 8082
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:local}

# Logging (structured format with traceId)
logging:
  level:
    root: INFO
    com.scopeflow.user: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - traceId=%X{traceId} %msg%n'
    dateformat: "yyyy-MM-dd HH:mm:ss.SSS,UTC"

# JWT Configuration (SHARED secret with monolith -- tokens are cross-compatible)
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production-minimum-32-characters-long}
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration: 604800000

# CORS Configuration
cors:
  allowed-origins:
    - ${CORS_ORIGIN_LOCAL:http://localhost:3000}
    - ${CORS_ORIGIN_PROD:https://app.scopeflow.com}

# Cookie and HTTPS security
app:
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
  requires-https: ${APP_REQUIRES_HTTPS:false}
  rate-limit:
    # IPs dos reverse proxies confiáveis (ex: IP do container Traefik), separados por vírgula.
    # Quando configurado, X-Forwarded-For só é lido se a conexão vier de um desses IPs.
    # Se vazio (padrão), RemoteAddr é sempre usado — comportamento seguro sem proxy.
    # Risco de IP spoofing: nunca confiar em X-Forwarded-For sem validar RemoteAddr contra esta lista.
    # Para descobrir o IP do Traefik: docker inspect scopeflow-traefik | grep IPAddress
    trusted-proxies: ${APP_RATE_LIMIT_TRUSTED_PROXIES:}
