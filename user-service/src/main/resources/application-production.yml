# ============================================================
# Production profile — ScopeFlow user-service
#
# ESTADO ATUAL: banco compartilhado com o monólito (pré cut-over).
# Flyway DESABILITADO para evitar conflito de versão com as migrations do monólito.
#
# APÓS CUT-OVER DE PRODUÇÃO (ver DB_MIGRATION_GUIDE.md):
#   1. Executar pg_dump + restore para scopeflow_users (banco dedicado)
#   2. Atualizar SPRING_DATASOURCE_URL → jdbc:postgresql://{host}/scopeflow_users
#   3. Alterar flyway.enabled: true abaixo
#   4. Reiniciar user-service
#
# Para ativar: SPRING_PROFILES_ACTIVE=production
# Porta padrão 8081, sobrescrita via SERVER_PORT env var no K8s se necessário.
# ============================================================

server:
  port: ${SERVER_PORT:8081}

# TODO (pós cut-over produção): alterar enabled para true e apontar datasource
#      para o banco dedicado scopeflow_users. Ver DB_MIGRATION_GUIDE.md.
spring:
  flyway:
    enabled: false

# Cookies HTTPS obrigatório em produção
app:
  cookie:
    secure: true
  requires-https: true

# Logs produção — INFO por padrão, sem DEBUG
logging:
  level:
    root: INFO
    com.scopeflow.user: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
