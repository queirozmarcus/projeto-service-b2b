# ============================================================
# Production profile — ScopeFlow user-service
#
# ESTADO ATUAL: cut-over executado — user-service aponta para banco dedicado
# scopeflow_users no container postgres principal (porta 5432).
# Flyway HABILITADO — user-service gerencia seu próprio schema de forma independente.
#
# DATASOURCE: sobrescrever via env var SPRING_DATASOURCE_URL em produção
#   para apontar ao host real do PostgreSQL (ex: RDS endpoint).
#   O default abaixo é apenas referência; em produção SPRING_DATASOURCE_URL
#   deve ser obrigatoriamente definido como variável de ambiente.
#
# Para ativar: SPRING_PROFILES_ACTIVE=production
# Porta padrão 8081, sobrescrita via SERVER_PORT env var no K8s se necessário.
# ============================================================

server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scopeflow_users}

  # Cut-over executado: Flyway habilitado — user-service é dono do schema scopeflow_users.
  # baseline-on-migrate e baseline-version herdados do application.yml base.
  flyway:
    enabled: true

# Cookies HTTPS obrigatório em produção
app:
  cookie:
    secure: true
  requires-https: true

# Logs produção — INFO por padrão, sem DEBUG
logging:
  level:
    root: INFO
    com.scopeflow.user: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
