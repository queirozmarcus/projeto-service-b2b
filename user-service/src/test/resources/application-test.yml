spring:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: test-secret-key-minimum-32-characters-long-for-hmac-sha256
  expiration: 900000
  refresh-expiration: 604800000

app:
  cookie:
    secure: false
  requires-https: false

cors:
  allowed-origins:
    - http://localhost:3000

logging:
  level:
    root: WARN
    com.scopeflow.user: DEBUG
