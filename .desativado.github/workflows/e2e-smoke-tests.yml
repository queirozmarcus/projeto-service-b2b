name: E2E Smoke Tests - Auth Flow

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/src/**'
      - 'user-service/src/**'
      - 'tests/e2e/**'
      - 'docker-compose.yml'
      - '.github/workflows/e2e-smoke-tests.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  e2e-monolith-mode:
    name: E2E Tests (Monolith Mode)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend JAR
        run: |
          cd backend
          ./mvnw clean package -DskipTests
          cd ..

      - name: Start services (monolith mode)
        run: |
          docker compose up -d postgres redis rabbitmq backend
          echo "Waiting for services to be healthy..."

      - name: Wait for backend health
        run: |
          timeout 120 bash -c '
            until curl -sf http://localhost:8080/actuator/health/readiness > /dev/null 2>&1; do
              echo "Waiting for backend to be ready..."
              sleep 3
            done
          '
          echo "Backend is ready!"

      - name: Run E2E smoke tests (flag=false)
        env:
          BASE_URL: http://localhost:8080
          AUTH_SERVICE_EXTRACTED: false
        run: |
          chmod +x tests/e2e/auth-flow.test.sh
          ./tests/e2e/auth-flow.test.sh

      - name: Show backend logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker logs scopeflow-backend 2>&1 | tail -200

      - name: Cleanup
        if: always()
        run: docker compose down -v

  e2e-user-service-mode:
    name: E2E Tests (User Service Mode)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend JAR
        run: |
          cd backend
          ./mvnw clean package -DskipTests
          cd ..

      - name: Build user-service JAR
        run: |
          cd user-service
          ./mvnw clean package -DskipTests
          cd ..

      - name: Create .env with feature flag enabled
        run: |
          cp .env.example .env
          echo "AUTH_SERVICE_EXTRACTED=true" >> .env
          echo "AUTH_SERVICE_URL=http://user-service:8081/api/v1" >> .env

      - name: Start services (user-service mode)
        run: |
          docker compose up -d postgres redis rabbitmq user-service backend traefik
          echo "Waiting for services to be healthy..."

      - name: Wait for services health
        run: |
          # Wait for user-service
          timeout 120 bash -c '
            until curl -sf http://localhost:8081/actuator/health/readiness > /dev/null 2>&1; do
              echo "Waiting for user-service to be ready..."
              sleep 3
            done
          '
          echo "User-service is ready!"

          # Wait for backend
          timeout 120 bash -c '
            until curl -sf http://localhost:8080/actuator/health/readiness > /dev/null 2>&1; do
              echo "Waiting for backend to be ready..."
              sleep 3
            done
          '
          echo "Backend is ready!"

      - name: Verify Traefik routing
        run: |
          echo "=== Traefik Configuration ==="
          docker exec scopeflow-traefik wget -qO- http://localhost:8080/api/v1/health || true

      - name: Run E2E smoke tests (flag=true)
        env:
          BASE_URL: http://localhost:8080
          AUTH_SERVICE_EXTRACTED: true
        run: |
          chmod +x tests/e2e/auth-flow.test.sh
          ./tests/e2e/auth-flow.test.sh

      - name: Validate JWT cross-service compatibility
        if: success()
        run: |
          echo "=== JWT Compatibility Test ==="
          echo "JWT generated by user-service was accepted by monolith ✅"
          echo "This confirms JWT signing keys are synchronized."

      - name: Show Traefik logs on failure
        if: failure()
        run: |
          echo "=== Traefik Logs ==="
          docker logs scopeflow-traefik 2>&1 | tail -100

      - name: Show user-service logs on failure
        if: failure()
        run: |
          echo "=== User Service Logs ==="
          docker logs scopeflow-user-service 2>&1 | tail -200

      - name: Show backend logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker logs scopeflow-backend 2>&1 | tail -200

      - name: Cleanup
        if: always()
        run: docker compose down -v

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [e2e-monolith-mode, e2e-user-service-mode]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "=== E2E Smoke Tests Summary ==="
          echo "Monolith mode: ${{ needs.e2e-monolith-mode.result }}"
          echo "User-service mode: ${{ needs.e2e-user-service-mode.result }}"

          if [ "${{ needs.e2e-monolith-mode.result }}" != "success" ] || [ "${{ needs.e2e-user-service-mode.result }}" != "success" ]; then
            echo "❌ Some tests failed. Deployment blocked."
            exit 1
          else
            echo "✅ All E2E smoke tests passed! Safe to deploy."
          fi
