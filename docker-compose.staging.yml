# ============================================================
# Docker Compose override — Staging
#
# User Service usa banco unificado (postgres:5432):
#   - SPRING_PROFILES_ACTIVE=staging → carrega application-staging.yml
#   - Banco: postgres:5432/scopeflow_users (mesmo servidor do monólito)
#   - user-db removido — S5: unificação PostgreSQL concluída
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Para subir apenas o user-service:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d user-service
#
# Deploy após mudanças de schema:
#   docker compose down -v
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#   (Flyway aplica migrations automaticamente no startup)
# ============================================================

services:
  user-service:
    environment:
      SPRING_PROFILES_ACTIVE: staging
      # Banco unificado — mesma instância postgres do monólito, database separado
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scopeflow_users
    depends_on:
      postgres:
        condition: service_healthy
